<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Log</title>
<meta name="description" content="Workout log with templates, easier and harder alternates, and how-to notes. Your data stays on your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>
/* Layout: one-thumb phone logbook. Sticky header, single column (max 560px), fixed bottom tab bar, bottom sheets for pickers. */
:root{
  --bg:#eceff2;
  --surface:#ffffff;
  --surface-2:#e2e7ec;
  --ink:#12171c;
  --muted:#5a6570;
  --line:#d2d9e0;
  --accent:#2149bd;
  --accent-ink:#ffffff;
  --accent-soft:#dbe3fa;
  --chalk:#f0bd1f;
  --chalk-ink:#1d1704;
  --chalk-soft:#fbefc4;
  --danger:#b8362a;
  --scrim:rgba(14,18,24,.45);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:62px;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1114; --surface:#171b20; --surface-2:#232a31; --ink:#e8ecf0; --muted:#98a3ad; --line:#2b333b;
    --accent:#7d9bff; --accent-ink:#0a1024; --accent-soft:#1f2a4a; --chalk:#f0bd1f; --chalk-ink:#1d1704; --chalk-soft:#3a3214;
    --danger:#ff7a6b; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#171b20; --surface-2:#232a31; --ink:#e8ecf0; --muted:#98a3ad; --line:#2b333b;
  --accent:#7d9bff; --accent-ink:#0a1024; --accent-soft:#1f2a4a; --chalk:#f0bd1f; --chalk-ink:#1d1704; --chalk-soft:#3a3214;
  --danger:#ff7a6b; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);
}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-family:var(--f-body);text-transform:none;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:10px 8px 10px 0;cursor:pointer;display:flex;align-items:center;gap:2px}

main{padding-block:16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 96px)}
main > .wrap{display:flex;flex-direction:column;gap:20px}

/* Type */
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.display{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1;margin:0;letter-spacing:.005em;text-wrap:balance}
h3.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin:0;font-weight:500}

/* Buttons */
.btn{border:0;border-radius:12px;min-height:46px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-outline{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-quiet{background:transparent;color:var(--muted)}
.btn-danger{background:transparent;color:var(--danger)}
.btn.is-armed{background:var(--danger);color:#fff}
.btn-wide{width:100%}
.btn-sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row > .btn{flex:1 1 140px}

/* Grouped list */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;cursor:pointer;min-height:56px}
.row + .row{border-top:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;display:block;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);display:block;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);flex:none}
.date-block{flex:none;width:44px;text-align:center;line-height:1}
.date-block b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700}
.date-block span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* Cards */
.tpl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.tpl-card h4{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;margin:0;line-height:1}
.tpl-card p{margin:0;font-size:14px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.notice{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.empty h4{margin:0;font-size:18px}
.empty p{margin:0;color:var(--muted);font-size:15px}

/* Workout */
.wk-head{display:flex;gap:12px;align-items:flex-end}
.wk-head .grow{flex:1;min-width:0}
.name-input{width:100%;border:0;background:transparent;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:32px;line-height:1.1;padding:2px 0;border-bottom:2px solid transparent;border-radius:0}
.name-input:focus{outline:none;border-bottom-color:var(--accent)}
.clock{text-align:right;flex:none}
.clock-num{display:block;font-family:var(--f-display);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px}
.entry-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.entry-name{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 0;cursor:pointer}
.entry-name b{display:block;font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.05;color:var(--accent);overflow-wrap:anywhere}
.entry-name small{font-size:12px;color:var(--muted);font-weight:500}
.target{font-family:var(--f-display);font-weight:600;font-size:18px;background:var(--surface-2);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.set-grid{display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:8px;align-items:center;border-radius:10px;padding:3px 4px}
.set-row.two{column-gap:6px;row-gap:6px;padding-block:6px}
.set-row.two .set-n{grid-row:span 2}
.set-row.two .chk{grid-column:-2 / -1;grid-row:1 / span 2}
.set-row.hdr{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:0}
.set-row.hdr span{text-align:center}
.set-row.hdr span.ph{text-align:left}
.set-row.is-done{background:var(--chalk-soft)}
.set-n{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:center}
.side{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.prev{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{width:100%;height:44px;border:0;border-radius:9px;background:var(--surface-2);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.cell::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.cell:focus{outline:2px solid var(--accent);outline-offset:0}
.is-done .cell{background:transparent}
.chk{width:44px;height:44px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.chk svg{width:22px;height:22px}
.chk[aria-pressed="true"]{background:var(--chalk);color:var(--chalk-ink)}
.seg.lvl{margin-bottom:8px}
.seg.lvl button{min-height:36px;font-size:13px}
.lvl-note{margin:-2px 0 8px 2px}
.entry-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:10px 4px;cursor:pointer}
.link-btn.dim{color:var(--muted)}

/* Rest timer */
#rest{
  position:fixed;left:0;right:0;z-index:6;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding:8px max(16px, env(safe-area-inset-right,0px)) 8px max(16px, env(safe-area-inset-left,0px));
  pointer-events:none;
}
.rest-in{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.rest-in .eyebrow{color:inherit;opacity:.7}
.rest-num{font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;flex:1;line-height:1;min-width:0;white-space:nowrap}
.rest-in button{border:0;border-radius:10px;background:rgba(127,127,127,.25);color:inherit;font-weight:600;min-height:40px;padding:0 10px;cursor:pointer;white-space:nowrap}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--chalk);width:0}
.rest-in.over{background:var(--chalk);color:var(--chalk-ink)}

/* Tabs */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px, env(safe-area-inset-left,0px));
}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:9px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--chalk);box-shadow:0 0 0 2px var(--surface)}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{
  position:relative;background:var(--bg);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;
  padding:8px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  width:100%;max-width:600px;margin:0 auto;
}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-8px;background:var(--bg);padding-block:8px;z-index:1}
.panel-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:26px;line-height:1}
.panel .stack{gap:14px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.input,.textarea,.select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px}
.textarea{resize:vertical;min-height:120px;line-height:1.5}
.input:focus,.textarea:focus,.select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search{width:100%;border:0;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:16px}
.toolbar{display:flex;gap:10px;align-items:center}
.toolbar .search{flex:1;min-width:0}
.err{color:var(--danger);font-size:14px;margin:0}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:600;font-size:14px;padding:0 4px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.track-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.track-opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.track-opt b{font-weight:600}
.track-opt span{font-size:12px;color:var(--muted)}
.track-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.track-opt[aria-pressed="true"] b{color:var(--accent)}
.check-row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.check-row input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.check-row b{display:block;font-weight:600}

/* Exercise detail */
.chip{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px}
.chip.alt{background:var(--chalk-soft);color:var(--ink)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.detail-head{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0;overflow-wrap:anywhere;max-width:65ch}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.media-item{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:1/1;max-width:100%}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover;display:block;border:0}
.media-item button.view{position:absolute;inset:0;border:0;background:transparent;cursor:zoom-in}
.media-item .rm{position:absolute;top:6px;right:6px;border:0;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:600;padding:6px 10px;cursor:pointer}
.media-item .rm.is-armed{background:var(--danger)}
.media-item .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 6px;pointer-events:none}
.links a{display:flex;align-items:center;gap:10px;padding:12px 14px;text-decoration:none;color:var(--ink);min-height:52px}
.links a + a{border-top:1px solid var(--line)}
.links .host{font-size:13px;color:var(--muted);display:block}
.link-edit{display:flex;align-items:center;gap:10px;padding:10px 12px}
.link-edit + .link-edit{border-top:1px solid var(--line)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 4px}
.chart svg{width:100%;height:auto;display:block}
.c-grid{stroke:var(--line);stroke-width:1}
.c-line{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent);opacity:.12}
.c-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.c-end{fill:var(--chalk);stroke:var(--ink);stroke-width:1.5}
.c-txt{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.sets-inline{font-variant-numeric:tabular-nums;font-size:14px}
.best{background:var(--chalk);color:var(--chalk-ink);border-radius:5px;padding:0 4px;font-weight:600}

/* Template editor */
.ti{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.ti-top{display:flex;align-items:center;gap:6px}
.ti-top .ti-name{flex:1;min-width:0}
.ti-top b{display:block;font-family:var(--f-display);font-size:21px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.ti-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ti-fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.ti-fields label.wide{grid-column:span 2}
.ti-fields .cell{font-size:16px}
.mini{border:0;background:var(--surface-2);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.mini svg{width:18px;height:18px}
.mini:disabled{opacity:.35;cursor:default}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.week div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.week b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week span{font-size:12px;color:var(--muted)}
.sess-entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sess-entry h4{margin:0}
.sess-entry h4 button{border:0;background:transparent;padding:0;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;color:var(--accent);text-align:left;line-height:1.1}

/* Toast */

function inputHTML(e, i, j, key, st, prev, sd){

function groupedExercises(q){

  return {list, groups, order};
}
function exListHTML(){

function statsHTML(cfg, same, all){
  const tile = (b, label) => '<div class="stat"><b>' + esc(b) + '</b><span>' + esc(label) + '</span></div>';
  const dl = t => fmtDate(t, {month:'short', day:'numeric'});
  let tiles;
  if (cfg.track === 'wr'){
    let best = null, bestS = null;
    same.forEach(x => { const b = bestSet(x.sets, exCfg(x.e).sides); if (b && (!best || b.v > best.v)){ best = b; bestS = x.s; } });
    tiles = tile(best ? fmt(best.w) + ' × ' + fmt(best.r) + (best.side ? ' ' + best.side : '') : '–', 'Best set' + (bestS ? ', ' + dl(bestS.startedAt) : '')) +
      tile(best ? String(Math.round(best.v)) : '–', 'Est. 1RM (' + S.units + ')') + tile(String(all.length), 'Sessions');
  } else if (cfg.track === 'reps'){
    let m = null; same.forEach(x => { const v = maxOf(x.sets, 'r', exCfg(x.e).sides, num); if (v != null && (m == null || v > m)) m = v; });
    const last = same[0]; const tot = last ? sumOf(last.sets, 'r', exCfg(last.e).sides, num) : 0;
    tiles = tile(m != null ? fmt(m) : '–', 'Most reps in a set') + tile(fmt(tot) || '–', 'Total reps last time') + tile(String(all.length), 'Sessions');
  } else if (cfg.track === 'time'){
    let m = null; same.forEach(x => { const v = maxOf(x.sets, 't', exCfg(x.e).sides, parseDur); if (v != null && (m == null || v > m)) m = v; });
    const last = same[0]; const tot = last ? sumOf(last.sets, 't', exCfg(last.e).sides, parseDur) : 0;
    tiles = tile(m != null ? mmss(m) : '–', 'Longest set') + tile(tot ? mmss(tot) : '–', 'Total time last time') + tile(String(all.length), 'Sessions');
  } else {
    const last = same[0]; const done = last ? last.sets.filter(x => x.done !== false).length : 0;
    tiles = tile(String(all.length), 'Sessions') + tile(last ? done + ' / ' + last.sets.length : '–', 'Sets done last time') + tile(all[0] ? dl(all[0].s.startedAt) : '–', 'Last done');
  }
  return '<div class="stats">' + tiles + '</div>';
}
function exerciseBodyHTML(ex){

function chartSVG(pts, yf, label, unit){
  const W = 320, H = 150, pl = 38, pr = 14, pt = 14, pb = 26;
  let min = Math.min(...pts.map(p => p.w)), max = Math.max(...pts.map(p => p.w));
  if (min === max){ min -= 5; max += 5; }
  const padv = (max - min) * 0.12; min = Math.max(0, min - padv); max = max + padv;
  const n = pts.length;
  const x = i => pl + i * (W - pl - pr) / (n - 1);
  const y = v => pt + (max - v) / (max - min) * (H - pt - pb);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.w).toFixed(1)).join(' ');
  const area = line + ' L' + x(n - 1).toFixed(1) + ' ' + (H - pb) + ' L' + x(0).toFixed(1) + ' ' + (H - pb) + ' Z';
  const ticks = [min, (min + max) / 2, max];
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + ', from ' + esc(yf(pts[0].w) + unit) + ' to ' + esc(yf(pts[n - 1].w) + unit) + '">';
  ticks.forEach(v => { s += '<line class="c-grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="c-txt" x="' + (pl - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + esc(yf(v)) + '</text>'; });
  s += '<path class="c-area" d="' + area + '"/><path class="c-line" d="' + line + '"/>';
  pts.forEach((p, i) => { s += '<circle class="' + (i === n - 1 ? 'c-end' : 'c-dot') + '" cx="' + x(i).toFixed(1) + '" cy="' + y(p.w).toFixed(1) + '" r="' + (i === n - 1 ? 5 : 3.2) + '"/>'; });
  const dl = t => new Date(t).toLocaleDateString(undefined, {month:'short', day:'numeric'});
  s += '<text class="c-txt" x="' + pl + '" y="' + (H - 6) + '" text-anchor="start">' + esc(dl(pts[0].t)) + '</text><text class="c-txt" x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(dl(pts[n - 1].t)) + '</text></svg>';
  return s;
}

function tick(){
  const e = $('#elapsed'); if (e && S.active) e.textContent = mmss((Date.now() - S.active.startedAt) / 1000);

    const left = (S.restEnd - Date.now()) / 1000;

async function toJpeg(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600; const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', 0.85));
  } finally { URL.revokeObjectURL(url); }
}
function uploadErr(e, name){
  switch (e && e.code){
    case 'too_large': return name + ' is over 20 MB. Trim the clip in Photos or record at a lower resolution.';
    case 'unsupported_type': return name + ' is a format the app can\'t store. Use a photo, MP4 or MOV video.';
    case 'quota_or_state': return 'Media storage is full. Remove some photos or videos first.';
    case 'rate_limited': return 'Uploading too fast. Wait a moment and try again.';
    default: return 'Could not upload ' + name + '. Try again.';
  }
}
async function handleFiles(files){
  const status = () => $('#upStatus');
  for (const f of files){
    if (!S.draft) return;
    const isVid = f.type.startsWith('video/') || /\.(mov|mp4|m4v|webm)$/i.test(f.name);
    const isImg = f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|gif|webp)$/i.test(f.name);
    if (status()) status().textContent = 'Uploading ' + f.name + '…';
    try {
      let blob = f, type, kind;
      if (isVid){
        kind = 'video';
        if (f.size > 150 * 1024 * 1024){ if (status()) status().textContent = f.name + ' is over 150 MB. Trim the clip in Photos first.'; continue; }
        type = f.type || 'video/mp4';
      } else if (isImg){
        kind = 'image';
        if (f.type === 'image/gif'){ type = 'image/gif'; } else { blob = await toJpeg(f); type = 'image/jpeg'; }
      } else { if (status()) status().textContent = f.name + ' is not a photo or video.'; continue; }
      const r = await S.assets.upload(blob, {type});
      if (!S.draft) return;
      S.draft.media.push({id:r.id, type:kind}); S.draftNew.push(r.id);
      render();
      if (status()) status().textContent = 'Added. Remember to tap Save exercise.';
    } catch(e){ if (status()) status().textContent = uploadErr(e, f.name); }
  }
}

      const d = clone(src);
      d.entries.forEach(e => { const c = exCfg(e); const keys = allKeys(c); e.sets.forEach(st => { keys.forEach(k => { st[k] = fmtVal(k, st[k]); }); if (c.track !== 'check') st.done = true; }); });
      go('history', {type:'session-edit', id}); S.draft = d; render(); break;
    }
    case 'save-edit': {
      const d = S.draft; if (!d) break;
      d.entries = d.entries.map(e => {
        const c = exCfg(e); const keys = allKeys(c);
        const sets = c.track === 'check' ? e.sets.map(st => ({done:!!st.done}))
          : e.sets.filter(st => keys.some(k => !isBlank(st[k]))).map(st => { const o = {done:true}; keys.forEach(k => { o[k] = valNum(k, st[k]); }); return o; });
        return Object.assign({}, e, {name:exName(e.exId, e.name), track:c.track, sides:c.sides, sets});
      }).filter(e => e.track === 'check' ? e.sets.some(x => x.done) : e.sets.length);
      Store.save('sessions', d); S.draft = null; go('history', {type:'session', id:d.id}); toast('Changes saved'); break;
    }
    case 'delete-session': { if (!armed('sess-del', b, 'Tap again to delete')) break; Store.remove('sessions', id); go('history'); toast('Workout deleted'); break; }
  }
});

/* ---------- Backup and restore ---------- */
const blobToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
function b64ToBlob(b64, type){ const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type:type || 'application/octet-stream'}); }
function backupName(){ const d = new Date(); return 'iron-log-backup-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.json'; }
async function buildBackup(withMedia){
  const data = Object.assign({app:'iron-log', format:1, exportedAt:Date.now()}, JSON.parse(JSON.stringify(snapshotState())), {media:[]});
  if (withMedia && IDB){
    const all = await idbDo('media', 'readonly', st => st.getAll()) || [];
    for (const m of all) if (m && m.blob) data.media.push({id:m.id, type:m.type, data:await blobToB64(m.blob)});
  }
  return new File([JSON.stringify(data)], backupName(), {type:'application/json'});
}
/* Must start inside a tap: iPhones open the share sheet only from a direct user action. */
async function shareFile(file){
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'Iron Log backup'}); return true; }
    catch(e){ if (e && e.name === 'AbortError'){ toast('Backup not saved'); return false; } }
  }
  const u = URL.createObjectURL(file); const a = document.createElement('a'); a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
  return true;
}
function markBackedUp(file){ S.lastBackup = Date.now(); S.readyFile = null; Store.persistSoon(); toast('Backup saved: ' + file.name); if (S.sheet) renderSheet(); }
async function exportBackup(withMedia, btn){
  flushActive(); Store.flush();
  if (!withMedia){
    try { const file = new File([JSON.stringify(Object.assign({app:'iron-log', format:1, exportedAt:Date.now()}, JSON.parse(JSON.stringify(snapshotState())), {media:[]}))], backupName(), {type:'application/json'}); if (await shareFile(file)) markBackedUp(file); }
    catch(e){ toast('Could not create the backup. Try again.'); }
    return;
  }
  if (btn){ btn.disabled = true; btn.textContent = 'Preparing photos and videos…'; }
  try { S.readyFile = await buildBackup(true); toast('Backup ready. Tap Save backup file.'); }
  catch(e){ S.readyFile = null; toast('Could not create the backup. Try again.'); }
  if (S.sheet) renderSheet();
}
async function readImport(file){
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.app !== 'iron-log' || !Array.isArray(d.exercises)) throw new Error('not a backup');
    const done = (d.sessions || []).filter(s => s.status === 'done').length;
    const nm = (d.media || []).length;
    S.pendingImport = {name:file.name, data:d, summary:esc(d.exercises.length + ' exercises · ' + (d.templates || []).length + ' templates · ' + done + ' workouts' + (nm ? ' · ' + nm + ' photos/videos' : '') + (d.exportedAt ? ' · saved ' + fmtDate(d.exportedAt, {month:'short', day:'numeric', year:'numeric'}) : ''))};
  } catch(e){ S.pendingImport = null; toast('That file is not an Iron Log backup.'); }
  render();
}
async function doImport(){
  const pi = S.pendingImport; if (!pi) return;
  const d = pi.data;
  try {
    if (IDB){
      const old = await idbDo('media', 'readonly', st => st.getAllKeys()) || [];
      await idbDo('media', 'readwrite', st => { old.forEach(k => st.delete(k)); return null; });
      mediaUrls.forEach(u => URL.revokeObjectURL(u)); mediaUrls.clear();
      for (const m of (d.media || [])){ if (!m || !m.id || !m.data) continue; const blob = b64ToBlob(m.data, m.type); await idbDo('media', 'readwrite', st => st.put({id:m.id, type:m.type, blob})); mediaUrls.set(m.id, URL.createObjectURL(blob)); }
    }
    S.active = null; S.restEnd = null; releaseWake();
    applyState(Object.assign({}, d, {setupDone:true, lastBackup:Date.now()}));
    S.pendingImport = null; await Store.write(); adoptActive();
    const missing = S.exercises.reduce((n, e) => n + (e.media || []).filter(m => !mediaUrls.has(m.id)).length, 0);
    go('log'); toast('Backup restored' + (missing ? '. ' + missing + ' photos/videos were not in this backup.' : ''));
  } catch(e){ toast(e && e.name === 'QuotaExceededError' ? 'Not enough space on this phone to restore the photos and videos.' : 'Could not restore that backup.'); }
}

/* ---------- Offline support and updates ---------- */
const APP_VERSION = '1.0';
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => { reg.update().catch(() => {}); }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController){ hadController = true; return; }
    if (S.active || typing()){ toast('Iron Log was updated. Changes apply next time you open it.'); return; }
    Store.flush(); setTimeout(() => location.reload(), 300);
  });
}

render();
Store.init();
})();
</script>
